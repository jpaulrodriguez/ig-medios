name: entrada por Telegram

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Ruta de un video del repo para probar el montaje (no publica nada)"
        required: false
        default: ""

concurrency:
  group: entrada
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  entrada:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Soltar lo que ya llegó a su hora
        if: github.event.inputs.prueba == ''
        env:
          TELEGRAM_ENTRADA_TOKEN: ${{ secrets.TELEGRAM_ENTRADA_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 entrada/procesar.py --despertar

      - name: Ver si hay algo que hacer
        id: mirar
        env:
          TELEGRAM_ENTRADA_TOKEN: ${{ secrets.TELEGRAM_ENTRADA_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.prueba }}" ]; then echo "hay=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$TELEGRAM_ENTRADA_TOKEN" ]; then echo "hay=0" >> "$GITHUB_OUTPUT"; echo "sin secreto"; exit 0; fi
          n=$(curl -s "https://api.telegram.org/bot${TELEGRAM_ENTRADA_TOKEN}/getUpdates?timeout=0" | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('result', [])))")
          echo "hay=$([ "$n" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "mensajes: $n"

      - uses: actions/setup-python@v5
        if: steps.mirar.outputs.hay == '1'
        with:
          python-version: "3.12"

      - name: Herramientas
        if: steps.mirar.outputs.hay == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper==1.1.1 "av==13.1.0" pillow==11.0.0 requests

      - uses: actions/cache@v4
        if: steps.mirar.outputs.hay == '1'
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo

      - name: Montar y programar
        if: steps.mirar.outputs.hay == '1'
        env:
          TELEGRAM_ENTRADA_TOKEN: ${{ secrets.TELEGRAM_ENTRADA_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRUEBA_VIDEO: ${{ github.event.inputs.prueba }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 entrada/procesar.py

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.prueba != ''
        with:
          name: prueba
          path: ${{ runner.temp }}/entrada/salida.mp4
